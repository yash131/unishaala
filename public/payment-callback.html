<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Processing Payment - Unishaala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }
    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 24px;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top: 4px solid #14b8a6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #1f2937;
      font-size: 24px;
      margin-bottom: 10px;
    }
    .message {
      color: #6b7280;
      margin-bottom: 20px;
    }
    .status {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      margin-top: 20px;
    }
    .status.success {
      background: #d1fae5;
      color: #065f46;
    }
    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }
    .status.pending {
      background: #fef3c7;
      color: #92400e;
    }
    .debug {
      margin-top: 20px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 8px;
      text-align: left;
      font-size: 12px;
      font-family: monospace;
      max-height: 200px;
      overflow: auto;
      display: none;
    }
    .debug.show { display: block; }
    .links {
      margin-top: 30px;
      display: none;
    }
    .links.show { display: block; }
    .links a {
      display: inline-block;
      padding: 12px 24px;
      background: #14b8a6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin: 5px;
      font-weight: 500;
    }
    .links a.secondary {
      background: #e5e7eb;
      color: #374151;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">U</div>
    <div id="spinner" class="spinner"></div>
    <h1 id="title">Processing Payment</h1>
    <p id="message" class="message">Please wait while we verify your payment...</p>
    <div id="status" class="status pending"></div>
    <div id="debug" class="debug"></div>
    <div id="links" class="links">
      <a href="/exams">Continue to Exams</a>
      <a href="/" class="secondary">Go to Home</a>
    </div>
  </div>

  <script>
    // Capture all payment data from URL and form POST
    const urlParams = new URLSearchParams(window.location.search);
    const paymentData = {};
    
    // Get all URL parameters
    for (const [key, value] of urlParams.entries()) {
      paymentData[key] = value;
    }

    // Also try to parse hash fragment if present
    if (window.location.hash) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      for (const [key, value] of hashParams.entries()) {
        paymentData[key] = value;
      }
    }

    console.log('Payment callback data:', paymentData);

    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const debugEl = document.getElementById('debug');
    const linksEl = document.getElementById('links');

    // Show debug info
    debugEl.textContent = JSON.stringify(paymentData, null, 2);

    async function processPayment() {
      const merchantTxnNo = paymentData.merchantTxnNo;
      
      if (!merchantTxnNo) {
        // No transaction ID - show error but try to find latest transaction
        statusEl.textContent = 'No transaction ID found in callback';
        statusEl.className = 'status error';
        debugEl.classList.add('show');
        
        // Try to check latest transaction anyway
        await checkLatestTransaction();
        return;
      }

      statusEl.textContent = 'Verifying transaction: ' + merchantTxnNo;
      statusEl.className = 'status pending';

      try {
        // First, try to process the callback data
        if (Object.keys(paymentData).length > 1) {
          const processResponse = await fetch('/api/payment/process-callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(paymentData),
            credentials: 'include'
          });
          
          const processResult = await processResponse.json();
          console.log('Process result:', processResult);
        }

        // Then check the final status
        await checkTransactionStatus(merchantTxnNo);

      } catch (error) {
        console.error('Error processing payment:', error);
        statusEl.textContent = 'Error: ' + error.message;
        statusEl.className = 'status error';
        debugEl.classList.add('show');
        linksEl.classList.add('show');
        spinnerEl.style.display = 'none';
      }
    }

    async function checkTransactionStatus(merchantTxnNo) {
      try {
        const response = await fetch('/api/payment/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ transactionId: merchantTxnNo }),
          credentials: 'include'
        });

        const result = await response.json();
        console.log('Status result:', result);

        if (result.success && result.data) {
          const status = result.data.status;
          
          if (status === 'SUCCESS') {
            // Redirect to success page
            window.location.href = '/payment/success?txn=' + merchantTxnNo;
          } else if (status === 'FAILED') {
            // Redirect to failed page
            const reason = result.data.txnRespDescription || 'Payment failed';
            window.location.href = '/payment/failed?txn=' + merchantTxnNo + '&reason=' + encodeURIComponent(reason);
          } else {
            // Still pending - show status and allow manual check
            statusEl.textContent = 'Payment status: ' + status;
            statusEl.className = 'status pending';
            spinnerEl.style.display = 'none';
            linksEl.classList.add('show');
            debugEl.classList.add('show');
          }
        } else {
          throw new Error(result.error || 'Failed to get status');
        }
      } catch (error) {
        console.error('Status check error:', error);
        statusEl.textContent = 'Could not verify payment status';
        statusEl.className = 'status error';
        spinnerEl.style.display = 'none';
        linksEl.classList.add('show');
        debugEl.classList.add('show');
      }
    }

    async function checkLatestTransaction() {
      try {
        const response = await fetch('/api/payment/latest', {
          method: 'GET',
          credentials: 'include'
        });

        const result = await response.json();
        if (result.success && result.data) {
          await checkTransactionStatus(result.data.merchantTxnNo);
        } else {
          spinnerEl.style.display = 'none';
          linksEl.classList.add('show');
        }
      } catch (error) {
        console.error('Latest transaction check error:', error);
        spinnerEl.style.display = 'none';
        linksEl.classList.add('show');
      }
    }

    // Start processing
    processPayment();
  </script>
</body>
</html>
