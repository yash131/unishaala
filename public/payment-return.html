<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processing Payment - Unishaala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 700px;
      width: 100%;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { color: #1f2937; margin-bottom: 10px; font-size: 24px; }
    p { color: #6b7280; margin-bottom: 20px; }
    .payload {
      background: #1f2937;
      color: #10b981;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 11px;
      max-height: 350px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 20px;
    }
    .payload-header {
      background: #374151;
      color: white;
      padding: 10px 15px;
      border-radius: 8px 8px 0 0;
      font-weight: 600;
      font-size: 14px;
      text-align: left;
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .payload-content {
      border-radius: 0 0 8px 8px;
      margin-top: 0;
    }
    .copy-btn {
      background: #14b8a6;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .copy-btn:hover { background: #0d9488; }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .status-badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      margin: 15px 0;
    }
    .status-success { background: #dcfce7; color: #166534; }
    .status-failed { background: #fee2e2; color: #991b1b; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .links { margin-top: 25px; }
    .links a { 
      color: white;
      background: #14b8a6;
      padding: 10px 20px;
      margin: 0 5px;
      text-decoration: none;
      border-radius: 8px;
      display: inline-block;
    }
    .links a:hover { background: #0d9488; }
    .links a.secondary {
      background: #e5e7eb;
      color: #374151;
    }
    .links a.secondary:hover { background: #d1d5db; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Processing Payment</h1>
    <p id="message">Please wait while we verify your payment...</p>
    <div id="statusBadge"></div>
    <div id="payloadSection" style="display:none;">
      <div class="payload-header">
        <span>ICICI Payment Response</span>
        <button class="copy-btn" onclick="copyPayload()">Copy JSON</button>
      </div>
      <div id="payload" class="payload payload-content"></div>
    </div>
    <div class="links" id="links" style="display:none;">
      <a href="/payment/success" id="successLink">View Details</a>
      <a href="/" class="secondary">Go to Home</a>
    </div>
  </div>

  <script>
    // This script captures POST data sent by ICICI and processes it
    (function() {
      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      const payloadEl = document.getElementById('payload');
      const payloadSection = document.getElementById('payloadSection');
      const spinnerEl = document.getElementById('spinner');
      const statusBadge = document.getElementById('statusBadge');
      const linksEl = document.getElementById('links');
      const successLink = document.getElementById('successLink');

      let paymentData = {};

      // 1. Get from URL query params (GET redirect)
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.forEach((value, key) => {
        paymentData[key] = value;
      });

      // 2. Get from URL hash
      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        hashParams.forEach((value, key) => {
          paymentData[key] = value;
        });
      }

      // 3. Check sessionStorage
      try {
        const stored = sessionStorage.getItem('icici_payment');
        if (stored) {
          Object.assign(paymentData, JSON.parse(stored));
          sessionStorage.removeItem('icici_payment');
        }
      } catch(e) {}

      // 4. Try to parse from document.referrer or any hidden form data
      // This won't work for POST but we try anyway
      
      console.log('Payment data collected:', paymentData);

      // Show payload if we have data
      if (Object.keys(paymentData).length > 0 && paymentData.merchantTxnNo) {
        showPayload(paymentData);
        processPayment(paymentData);
      } else {
        // No data from redirect, poll for status
        checkPaymentStatus();
      }

      function showPayload(data) {
        payloadSection.style.display = 'block';
        payloadEl.textContent = JSON.stringify(data, null, 2);
      }

      window.copyPayload = function() {
        navigator.clipboard.writeText(payloadEl.textContent);
        alert('Copied to clipboard!');
      };

      function showStatus(status, txnNo) {
        const badgeClass = status === 'SUCCESS' ? 'status-success' : 
                          status === 'FAILED' ? 'status-failed' : 'status-pending';
        statusBadge.innerHTML = '<span class="status-badge ' + badgeClass + '">' + status + '</span>';
        
        if (txnNo) {
          successLink.href = '/payment/success?txn=' + txnNo;
        }
        linksEl.style.display = 'block';
      }

      async function processPayment(data) {
        messageEl.textContent = 'Verifying payment with bank...';
        
        try {
          const response = await fetch('/api/payment/process-callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          console.log('Process result:', result);
          
          spinnerEl.style.display = 'none';
          
          if (result.success && result.status === 'SUCCESS') {
            titleEl.textContent = 'Payment Successful!';
            titleEl.className = 'success';
            messageEl.textContent = 'Your payment has been verified successfully.';
            showStatus('SUCCESS', data.merchantTxnNo);
          } else if (result.success) {
            titleEl.textContent = 'Payment Status: ' + result.status;
            messageEl.textContent = result.error || 'Payment verification completed.';
            showStatus(result.status, data.merchantTxnNo);
          } else {
            titleEl.textContent = 'Verification Issue';
            messageEl.textContent = result.error || 'Could not verify payment. Please check your email.';
            showStatus('PENDING', data.merchantTxnNo);
          }
        } catch (error) {
          console.error('Error:', error);
          spinnerEl.style.display = 'none';
          titleEl.textContent = 'Processing Error';
          messageEl.textContent = 'Error verifying payment. Please check your email for confirmation.';
          linksEl.style.display = 'block';
        }
      }

      let attempts = 0;
      let pendingTxnNo = paymentData.merchantTxnNo || null;
      
      async function checkPaymentStatus() {
        attempts++;
        messageEl.textContent = 'Checking payment status... (attempt ' + attempts + '/20)';
        
        try {
          // Pass merchantTxnNo if available so backend can verify with ICICI directly
          const requestBody = pendingTxnNo ? { merchantTxnNo: pendingTxnNo } : {};
          
          const response = await fetch('/api/payment/check-status-by-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(requestBody)
          });
          
          const result = await response.json();
          console.log('Status check result:', result);
          
          if (result.success && result.transaction) {
            showPayload(result.transaction.iciciPayload || result.transaction);
            
            if (result.transaction.status === 'SUCCESS') {
              spinnerEl.style.display = 'none';
              titleEl.textContent = 'Payment Successful!';
              titleEl.className = 'success';
              messageEl.textContent = 'Your payment has been verified.';
              showStatus('SUCCESS', result.transaction.merchantTxnNo);
              return;
            } else if (result.transaction.status === 'FAILED') {
              spinnerEl.style.display = 'none';
              titleEl.textContent = 'Payment Failed';
              titleEl.className = 'error';
              messageEl.textContent = 'Your payment could not be completed.';
              showStatus('FAILED', result.transaction.merchantTxnNo);
              return;
            }
          }
          
          // Still pending, retry
          if (attempts < 20) {
            setTimeout(checkPaymentStatus, 2500);
          } else {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Verification Timeout';
            messageEl.textContent = 'Could not verify payment automatically. Please check your email or contact support.';
            linksEl.style.display = 'block';
          }
        } catch (error) {
          console.error('Status check error:', error);
          if (attempts < 20) {
            setTimeout(checkPaymentStatus, 2500);
          } else {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Connection Error';
            messageEl.textContent = 'Could not connect to server. Please refresh or contact support.';
            linksEl.style.display = 'block';
          }
        }
      }
    })();
  </script>
</body>
</html>
