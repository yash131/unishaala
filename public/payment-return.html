<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processing Payment - Unishaala</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0fdfa 0%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e5e7eb;
      border-top-color: #14b8a6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { color: #1f2937; margin-bottom: 10px; font-size: 24px; }
    p { color: #6b7280; margin-bottom: 20px; }
    .payload {
      background: #f3f4f6;
      padding: 15px;
      border-radius: 8px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
      max-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 20px;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .links { margin-top: 20px; }
    .links a { color: #14b8a6; margin: 0 10px; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Processing Payment</h1>
    <p id="message">Please wait while we verify your payment...</p>
    <div id="payload" class="payload" style="display:none;"></div>
    <div class="links">
      <a href="/">Go to Home</a>
      <a href="/exams">Browse Exams</a>
    </div>
  </div>

  <script>
    // This script captures POST data and processes it
    (function() {
      const titleEl = document.getElementById('title');
      const messageEl = document.getElementById('message');
      const payloadEl = document.getElementById('payload');
      const spinnerEl = document.getElementById('spinner');

      // Collect data from various sources
      let paymentData = {};

      // 1. Get from URL query params
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.forEach((value, key) => {
        paymentData[key] = value;
      });

      // 2. Get from URL hash
      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        hashParams.forEach((value, key) => {
          paymentData[key] = value;
        });
      }

      // 3. Check sessionStorage for any stored data
      try {
        const stored = sessionStorage.getItem('icici_payment');
        if (stored) {
          Object.assign(paymentData, JSON.parse(stored));
          sessionStorage.removeItem('icici_payment');
        }
      } catch(e) {}

      // Show payload if we have data
      if (Object.keys(paymentData).length > 0) {
        payloadEl.style.display = 'block';
        payloadEl.textContent = JSON.stringify(paymentData, null, 2);
        processPayment(paymentData);
      } else {
        // No data from redirect, poll for status
        checkPaymentStatus();
      }

      async function processPayment(data) {
        messageEl.textContent = 'Verifying payment with bank...';
        
        try {
          const response = await fetch('/api/payment/process-callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          
          if (result.success && result.status === 'SUCCESS') {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Payment Successful!';
            titleEl.className = 'success';
            messageEl.textContent = 'Redirecting to confirmation page...';
            setTimeout(() => {
              window.location.href = '/payment/success?txn=' + (data.merchantTxnNo || data.txnId || '');
            }, 2000);
          } else {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Payment Status';
            messageEl.textContent = result.error || 'Payment verification completed';
            setTimeout(() => {
              window.location.href = '/payment/failed?txn=' + (data.merchantTxnNo || '') + '&reason=' + encodeURIComponent(result.error || 'Verification failed');
            }, 2000);
          }
        } catch (error) {
          console.error('Error:', error);
          messageEl.textContent = 'Error processing payment. Please check your email for confirmation.';
        }
      }

      let attempts = 0;
      async function checkPaymentStatus() {
        attempts++;
        messageEl.textContent = 'Checking payment status... (attempt ' + attempts + '/15)';
        
        try {
          const response = await fetch('/api/payment/check-status-by-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include'
          });
          
          const result = await response.json();
          
          if (result.success && result.transaction) {
            payloadEl.style.display = 'block';
            payloadEl.textContent = JSON.stringify(result.transaction, null, 2);
            
            if (result.transaction.status === 'SUCCESS') {
              spinnerEl.style.display = 'none';
              titleEl.textContent = 'Payment Successful!';
              titleEl.className = 'success';
              messageEl.textContent = 'Redirecting...';
              setTimeout(() => {
                window.location.href = '/payment/success?txn=' + result.transaction.merchantTxnNo;
              }, 1500);
              return;
            } else if (result.transaction.status === 'FAILED') {
              spinnerEl.style.display = 'none';
              titleEl.textContent = 'Payment Failed';
              titleEl.className = 'error';
              messageEl.textContent = 'Redirecting...';
              setTimeout(() => {
                window.location.href = '/payment/failed?txn=' + result.transaction.merchantTxnNo;
              }, 1500);
              return;
            }
          }
          
          // Still pending, retry
          if (attempts < 15) {
            setTimeout(checkPaymentStatus, 2000);
          } else {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Verification Timeout';
            messageEl.textContent = 'Could not verify payment automatically. Please check your email or contact support.';
          }
        } catch (error) {
          if (attempts < 15) {
            setTimeout(checkPaymentStatus, 2000);
          }
        }
      }
    })();
  </script>
</body>
</html>
